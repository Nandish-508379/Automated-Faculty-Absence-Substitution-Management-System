<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIEW DAY TIMETABLE</title>
    <style>
        table,th,td{
            border: 1px solid black; 
            border-collapse: collapse;
            width: 50%;
            text-align: center;
            }
    </style>
</head>
<body>
    <h1>VIEW TIMETABLE PAGE</h1>

    <table>
        <tr>
            <th>TEACHER</th>
            <th>CLASS</th>
            <th>PERIOD</th>
        </tr>
        {% for item in output_list %}
            <tr>
                <td>{{ item[0] }}</td>
                <td>{{ item[1] }}</td>
                <td>{{ item[2] }}</td>
            </tr>
        {% endfor %}
    </table>
    <br><br>
    <form action="/back_to_home_page" method="get">
        <input type="submit" value="back to home page">
    </form>
    <br>
    <form action="/Download_File" method="get">
        <input type="submit" value="Download File in CSV format">
    </form>
    <br>
    <button onclick="window.print()">PRINT THIS PAGE</button>
</body>
</html>
