<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password Page</title>
</head>
<body>
    <h1>Change Password</h1>
    <p> Current UserName: {{session.username}}</p>
    <p> Login day: {{session.day}}</p>

        <label for="New_PWD_1">ENTER NEW PASSWORD:</label><br>
        <input type="text" id="New_PWD_1" name="New_PWD_1" required>
        <hr>
        <input type="submit" value="submit">
    </form>

    <form action="/back_to_home_page" method="get">
        <input type="submit" value="back to home page">
    </form>
</body>
</html>
