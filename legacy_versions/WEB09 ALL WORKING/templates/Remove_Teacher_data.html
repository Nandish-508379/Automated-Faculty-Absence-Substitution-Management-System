<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Complete Day Page</title>
</head>
<body>
<h1>Delete Complete Day Page</h1>
<form action="/REMOVE_TEACHER_DEF_DAY" method="POST">
    <label for="teacherToRemove">Select a Teacher data to oremove on login day:</label>
    <select id="teacherToRemove" name="teacherToRemove">
        <option value="DEFAULT">Select Teacher to remove</option>
        {% for user in output_list2 %}
        <option value="{{ user[0] }}">{{ user[0] }}</option>
        {% endfor %}
    </select>
    <h5>ON SUCCESSFULL REMOVAL THIS SESSION WILL BE TERMINATED</h5>
    <h5>ON IN-PROPER SELECTION YOU WILL BE REDIRECTED TO BACK TO HOME PAGE</h5>
    <HR>
    <input ID ="SUBMIT_BUTTON" type="submit" value="YES DELETE THE SELECTED TEACHER DATA ON THE LOGIN DATE">
</form>
<br><br>
<form action="/back_to_home_page" method="get">
    <input type="submit" value="back to home page">
</form>
</body>
</html>
